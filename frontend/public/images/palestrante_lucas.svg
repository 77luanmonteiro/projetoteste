<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#241407" stop-opacity="1" />
      <stop offset="60%" stop-color="#0c0703" stop-opacity="1" />
      <stop offset="100%" stop-color="#050302" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ff2200" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlow)" />
  
  <!-- Subtle Grid lines -->
  <g opacity="0.08" stroke="#ff8800" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
  </g>

  <!-- Head/Hood Silhouette -->
  <g filter="url(#glow)">
    <!-- Shoulders / Torso -->
    <path d="M 160 800 C 180 620, 260 540, 340 500 L 460 500 C 540 540, 620 620, 640 800 Z" fill="#080503" stroke="url(#neonOrange)" stroke-width="4" />
    
    <!-- Hood Profile -->
    <path d="M 280 470 C 260 380, 270 240, 400 200 C 530 240, 540 380, 520 470 C 490 520, 310 520, 280 470 Z" fill="#080503" stroke="url(#neonOrange)" stroke-width="5" />
    
    <!-- Shrouded Face Interior -->
    <ellipse cx="400" cy="360" rx="95" ry="120" fill="#030201" />

    <!-- Glowing Cyber Visor / Eyes Teaser -->
    <path d="M 330 350 L 470 350" stroke="#ff7700" stroke-width="6" stroke-linecap="round" />
    <path d="M 345 350 L 455 350" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tech Teaser Badge -->
  <g transform="translate(400, 680)">
    <rect x="-110" y="-20" width="220" height="40" rx="20" fill="#140a02" stroke="#ff7700" stroke-width="1.5" />
    <text x="0" y="6" fill="#ffaa33" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">MEMBER REVEAL</text>
  </g>
</svg>
